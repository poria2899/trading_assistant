<div class="field-group">
    <label class="field-label" for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %} <span class="text-primary">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}
    <ul class="field-error-list">
        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
    {% endif %}
</div>
