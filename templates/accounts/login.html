{% extends "base.html" %}

{% block title %}Login — Trade Assistant{% endblock %}

{% block content %}
<div class="card">
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p>No account yet? <a href="{% url 'accounts:register' %}">Register</a></p>
</div>
{% endblock %}
