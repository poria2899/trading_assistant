{% extends "base.html" %}

{% block title %}Register — Trade Assistant{% endblock %}

{% block content %}
<div class="card">
    <h1>Register</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="{% url 'accounts:login' %}">Login</a></p>
</div>
{% endblock %}
